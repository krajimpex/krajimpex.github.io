name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        working-directory: Kraj-Impex-Website
        run: |
          node build.js
          touch dist/.nojekyll
          # 404.html uses root-relative links. A repo named <owner>.github.io is served at the domain root;
          # any other repo is served under /<repo>/, so the links need that prefix.
          repo="${{ github.event.repository.name }}"
          if [ "${repo,,}" != "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then
            sed -i "s#\\(href\\|src\\)=\"/#\\1=\"/$repo/#g" dist/404.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Kraj-Impex-Website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
